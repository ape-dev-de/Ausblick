name: Check PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          TYPES="feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert"
          REGEX="^(${TYPES})(\([a-zA-Z0-9_-]+\))?!?: .+"
          [[ "$TITLE" =~ $REGEX ]] || {
            echo "::error::Ungültiger PR-Titel '$TITLE'. Erwartet: <type>[optional scope]: <description> (z. B. feat: add login)"
            exit 1
          }